[workspace]
resolver = "3"
members = ["crates/sc-hash", "crates/sc-model"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
blake3 = "1"
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sc-hash = { path = "crates/sc-hash" }
sc-model = { path = "crates/sc-model" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
