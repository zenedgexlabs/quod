[workspace]
resolver = "3"
members = ["crates/quod-hash", "crates/quod-model", "crates/quod-graph", "crates/quod-change", "crates/quod-policy", "crates/quod-ladder", "crates/quod-cert", "crates/quod-verdict", "verifier", "crates/quod-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
blake3 = "1"
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
quod-hash = { path = "crates/quod-hash" }
quod-model = { path = "crates/quod-model" }
quod-graph = { path = "crates/quod-graph" }
quod-change = { path = "crates/quod-change" }
quod-policy = { path = "crates/quod-policy" }
quod-ladder = { path = "crates/quod-ladder" }
quod-cert = { path = "crates/quod-cert" }
quod-verdict = { path = "crates/quod-verdict" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
