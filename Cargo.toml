[workspace]
resolver = "3"
members = ["crates/sc-hash", "crates/sc-model", "crates/sc-graph", "crates/sc-change", "crates/sc-policy", "crates/sc-ladder", "crates/sc-cert", "verifier", "crates/sc-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
blake3 = "1"
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sc-hash = { path = "crates/sc-hash" }
sc-model = { path = "crates/sc-model" }
sc-graph = { path = "crates/sc-graph" }
sc-change = { path = "crates/sc-change" }
sc-policy = { path = "crates/sc-policy" }
sc-ladder = { path = "crates/sc-ladder" }
sc-cert = { path = "crates/sc-cert" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
