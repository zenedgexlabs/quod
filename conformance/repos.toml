# Repositories for the conformance replay (experiment E1).
#
# Each entry: git URL, branch, packages to install into the replay venv (the
# probe is always added), pytest arguments, and globs of source files that
# mutants may be injected into.
#
# Chosen for pure-Python packages with fast, offline test suites and active
# history. Add more freely: the harness has no per-repo code.

[repos.more-itertools]
url = "https://github.com/more-itertools/more-itertools"
branch = "master"
install = ["-e", "."]
pytest = ["tests", "-q", "-p", "no:cacheprovider"]
mutate = ["more_itertools/*.py"]

[repos.click]
url = "https://github.com/pallets/click"
branch = "main"
install = ["-e", "."]
pytest = ["tests", "-q", "-p", "no:cacheprovider"]
mutate = ["src/click/*.py"]

[repos.attrs]
url = "https://github.com/python-attrs/attrs"
branch = "main"
install = ["-e", ".", "hypothesis"]
pytest = ["tests", "-q", "-p", "no:cacheprovider"]
mutate = ["src/attr/*.py", "src/attrs/*.py"]

[repos.jinja]
url = "https://github.com/pallets/jinja"
branch = "main"
install = ["-e", ".", "trio"]
pytest = ["tests", "-q", "-p", "no:cacheprovider"]
mutate = ["src/jinja2/*.py"]

[repos.itsdangerous]
url = "https://github.com/pallets/itsdangerous"
branch = "main"
install = ["-e", ".", "freezegun"]
pytest = ["tests", "-q", "-p", "no:cacheprovider"]
mutate = ["src/itsdangerous/*.py"]

# Larger, widely used projects (added after run 5).

[repos.rich]
url = "https://github.com/Textualize/rich"
branch = "main"
install = ["-e", ".", "attrs"]
pytest = ["tests", "-q", "-p", "no:cacheprovider"]
mutate = ["rich/*.py"]

[repos.requests]
url = "https://github.com/psf/requests"
branch = "main"
install = ["-e", ".[socks]", "-r", "requirements-dev.txt"]
pytest = ["tests", "-q", "-p", "no:cacheprovider"]
mutate = ["src/requests/*.py"]

[repos.httpx]
url = "https://github.com/encode/httpx"
branch = "master"
install = ["-r", "requirements.txt"]
pytest = ["tests", "-q", "-p", "no:cacheprovider"]
mutate = ["httpx/*.py", "httpx/_transports/*.py"]

[repos.pydantic]
url = "https://github.com/pydantic/pydantic"
branch = "main"
install = ["-e", ".", "--group", "dev"]
pytest = ["tests", "-q", "-p", "no:cacheprovider", "--ignore=tests/mypy", "--ignore=tests/benchmarks"]
mutate = ["pydantic/*.py", "pydantic/_internal/*.py"]

# JavaScript / TypeScript (Vitest), ADR 013. `install` is a list of commands
# run in the repository; `dir` is where Vitest runs; `args` go to Vitest.

[repos.ufo]
url = "https://github.com/unjs/ufo"
branch = "main"
runner = "vitest"
install = [["npx", "--yes", "pnpm@10", "install", "--frozen-lockfile", "--ignore-scripts"]]
args = []
mutate = ["src/*.ts"]

[repos.remeda]
url = "https://github.com/remeda/remeda"
branch = "main"
runner = "vitest"
install = [["npm", "ci", "--ignore-scripts", "--no-audit", "--no-fund"]]
dir = "packages/remeda"
args = ["--project", "runtime"]
mutate = ["packages/remeda/src/*.ts"]
# Real timers: fail in about half of runs on unchanged code under load.
flaky = [
    "packages/remeda/src/funnel.remeda-debounce.test.ts::optional param maxWaitMs > should queue a trailing call for subsequent debounced calls after `maxWait`",
    "packages/remeda/src/funnel.test.ts::non-trivial (>0ms) timer duration > burst timer > maxBurstDurationMs limits the burst duration",
]

# date-fns' core package runs its tests only in browser mode, which the probe
# can't observe yet: the replay covers its Node packages (tz, utc, docs).
[repos.date-fns]
url = "https://github.com/date-fns/date-fns"
branch = "main"
runner = "vitest"
install = [["npx", "--yes", "pnpm@10", "install", "--frozen-lockfile", "--ignore-scripts"]]
args = ["--project", "!*browser*"]
mutate = ["pkgs/tz/src/*.ts", "pkgs/tz/src/*/index.ts", "pkgs/utc/src/*.ts", "pkgs/utc/src/*/index.ts"]

[repos.luxon]
url = "https://github.com/moment/luxon"
branch = "master"
runner = "jest"
install = [["npm", "ci", "--ignore-scripts", "--no-audit", "--no-fund"]]
mutate = ["src/*.js", "src/impl/*.js"]
# As in the project's CI: the tests assume this time zone and locale.
env = { TZ = "America/New_York", LANG = "en_US.utf8" }

# Slower suites, for the outreach batch (E9 on forks). `ci_timeout` is the
# per-job limit in minutes on GitHub's runners.

[repos.networkx]
url = "https://github.com/networkx/networkx"
branch = "main"
# As in its test-default and nightly jobs: without numpy and scipy, about
# 1,100 tests are skipped and the functions they cover are never recorded.
install = ["-e", ".[default,test]"]
pytest = ["networkx", "-q", "-p", "no:cacheprovider"]
mutate = ["networkx/algorithms/*.py", "networkx/classes/*.py"]
ci_timeout = 40

[repos.sqlfluff]
url = "https://github.com/sqlfluff/sqlfluff"
branch = "main"
install = ["-e", ".", "hypothesis"]
pytest = ["test", "-q", "-p", "no:cacheprovider"]
mutate = ["src/sqlfluff/core/parser/*.py", "src/sqlfluff/core/rules/*.py", "src/sqlfluff/rules/*/*.py"]
ci_timeout = 60

[repos.pylint]
url = "https://github.com/pylint-dev/pylint"
branch = "main"
install = ["-r", "requirements_test_min.txt"]
pytest = ["tests", "-q", "-p", "no:cacheprovider"]
mutate = ["pylint/checkers/*.py", "pylint/checkers/*/*.py"]
ci_timeout = 60

[repos.sphinx]
url = "https://github.com/sphinx-doc/sphinx"
branch = "master"
install = ["-e", ".", "--group", "test"]
pytest = ["tests", "-q", "-p", "no:cacheprovider"]
mutate = ["sphinx/util/*.py", "sphinx/domains/*.py", "sphinx/writers/*.py"]
ci_timeout = 60

[repos.black]
url = "https://github.com/psf/black"
branch = "main"
install = ["-e", ".[d]", "--group", "tests"]
pytest = ["tests", "-q", "-p", "no:cacheprovider"]
mutate = ["src/black/*.py", "src/blib2to3/pgen2/*.py"]
ci_timeout = 30

# pytest-randomly (in its tox deps) is left out: the replay needs a fixed order.
[repos.pygments]
url = "https://github.com/pygments/pygments"
branch = "master"
install = ["-e", ".", "wcag-contrast-ratio"]
pytest = ["tests", "-q", "-p", "no:cacheprovider"]
mutate = ["pygments/*.py", "pygments/formatters/*.py"]
ci_timeout = 30
