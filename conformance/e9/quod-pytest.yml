# E9: Quod on GitHub-hosted CI (pytest). Push to main records the map; each
# pull request runs two jobs on the same commit:
#   shadow  - the full suite, plus the list of tests Quod would skip
#             (a would-skip test that fails is an escape);
#   enforce - only the tests Quod doesn't skip (the time it saves).
name: quod
on:
  push: { branches: [main] }
  pull_request:

jobs:
  record:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -e . pytest
      - uses: zenedgexlabs/quod/integrations/github-action@main
        with: { mode: record, quod-version: v0.1.0-alpha.2, test-command: python -m pytest -q tests, python: python }

  pr:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix: { mode: [shadow, enforce] }
    runs-on: ubuntu-latest
    name: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -e . pytest
      - uses: zenedgexlabs/quod/integrations/github-action@main
        with: { mode: '${{ matrix.mode }}', quod-version: v0.1.0-alpha.2, test-command: python -m pytest -q tests, python: python }
