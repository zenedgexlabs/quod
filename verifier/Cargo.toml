[package]
name = "quod-verify"
description = "Independent verifier for Quod skip certificates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Trusted base: schemas (quod-model), hashing (quod-hash) and .qmap decoding
# (quod-graph format only). The decision checks here are re-implemented and
# must NOT call quod-ladder or quod-policy (ADR-006). Those appear only as
# dev-dependencies, to produce certificates for end-to-end tests.
[dependencies]
quod-graph.workspace = true
quod-hash.workspace = true
quod-model.workspace = true
ed25519-dalek = "2"
serde_json.workspace = true

[dev-dependencies]
quod-cert.workspace = true
quod-change.workspace = true
quod-ladder.workspace = true
quod-policy.workspace = true

[lints]
workspace = true
