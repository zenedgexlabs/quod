[package]
name = "quod-cli"
description = "The quod command-line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "quod"
path = "src/main.rs"

[dependencies]
quod-cert.workspace = true
quod-change.workspace = true
quod-graph.workspace = true
quod-hash.workspace = true
quod-ladder.workspace = true
quod-model.workspace = true
quod-policy.workspace = true
quod-verdict.workspace = true
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
quod-verify = { path = "../../verifier" }
quod-verdict.workspace = true
tempfile = "3"

[lints]
workspace = true
