[package]
name = "sc-cli"
description = "The skipcert command-line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "skipcert"
path = "src/main.rs"

[dependencies]
sc-cert.workspace = true
sc-change.workspace = true
sc-graph.workspace = true
sc-hash.workspace = true
sc-ladder.workspace = true
sc-model.workspace = true
sc-policy.workspace = true
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
skipcert-verify = { path = "../../verifier" }
tempfile = "3"

[lints]
workspace = true
