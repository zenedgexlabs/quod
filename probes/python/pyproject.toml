[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "quod-probe"
version = "0.4.0"
description = "pytest plugin that records per-test footprints for Quod"
requires-python = ">=3.12"
dependencies = ["pytest>=8"]
license = { text = "Proprietary" }

[project.entry-points.pytest11]
quod = "quod_probe.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/quod_probe"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

